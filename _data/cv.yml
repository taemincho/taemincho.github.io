cv:
  name: Taemin Cho
  label: Principal Engineer & AI/ML Lead at BandLab Technologies
  email:
  location: Singapore
  image: ""
  summary: >
    I lead the AI/ML team at BandLab Technologies, building music AI used by nearly 200M creators
    worldwide. My team develops and ships the models behind BandLab's AI features: music generation
    (MIDI and audio), source separation, voice enhancement, voice-to-MIDI, and music information
    retrieval, from research to real-time deployment on mobile devices. Before BandLab, I led
    Samsung's mobile DAW Soundcamp and spoke at Google I/O 2016 and as a keynote speaker at Samsung
    Developer Conference. I hold a Ph.D. in Music Technology from NYU, and I'm a trained guitarist
    (Berklee) who came to engineering through music.

